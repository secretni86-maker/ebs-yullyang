"id": "r-xwdwq7z", "cat": "elementary", "who": "초등 5학년  J*학부모님", "text": "영어 학원을 옮기면서 (J* 가 원해서 옮긴 것이 아니었어서..) 달라진 영어 공부 스타일로 환경에 적응을 잘할 지 사실 걱정이 많았어요.. 선생님께서 여러모로 신경 써주시고 잘 지도 해 주신 덕분에 한 달 이었지만 영어 실력은 확실히 향상되고 있는 느낌입니다. J*  이도 사실 그것을 알기에 숙제가 많다 힘들다 볼멘 소리를 해도 잘 다니고 있는 것 같습니다. 영어 여러 영역 들을 골고루 빈틈없이 공부하고 있는 것 같아 참 만족스럽고 좋습니다 .", "created": "2026-10-12"}, {"id": "r-zwves8r", "cat": "middle", "who": "중등 1학년 H*학생", "text": "수업이 매번 재미있었고 전에는 영어가 많이 싫었는데 이제는 영어도 재미있어 진거 같아요. 항상 열심히 알려주시고 배운 것도 엄청 많았다고 느끼는 것 같아요. 너무 너무 좋아요", "created": "2026-10-12"}, {"id": "r-ii93sdi", "cat": "middle", "who": "중등 3학년 O* 학부모님", "text": "선생님께서 사춘기 O*를 잘 컨트롤 해주셔서 끌고 가주시니 감사합니다. 그간 늘 80점대에서 벗어나지 못했는데 기말 만점이라니 저도 만족하고 아이도 기뻐하는 모습이에요!  수업 리뷰 보내주시는 요약정리 사진만 보아도 개념이 속속 쉽게 잘 설명해 주시는 것 같아 더 믿고 맡기겠습니다!", "created": "2026-10-12"}, {"id": "r-bi31wu2", "cat": "elementary", "who": "초등 2학년  W* 학부모님", "text": "W* 가 영어가 너무 재미있대요, 영어로만 말해도 조금 알아들을 것 같기도.. 라고 해서 정말 놀랐어요. 지금은 전에 했던거 보다 조금 쉬운거 하고 있기는 한데, 점점 어려워 지겠지만 혼자 하는게 아니라 선생님이 알려줘서 할 수 있을 것 같다고 이야기 하더라 구요!", "created": "2026-10-12"}, {"id": "r-psxzzd0", "cat": "elementary", "who": "초등 1학년 Y* 학부모님", "text": "선생님 덕분에 Y*이가 영어에 많은 관심과 흥미를 갖게 되었고 무엇보다 자신감도 많이 생긴 것 같아요. 항상 밝고 힘찬 에너지로 가르쳐 주시고 따뜻하게 보살펴 부셔서 정말 감사합니다. Y*이가 선생님을 만나 영어를 즐겁게 배울 수 있어서 참 다행이고 감사한 마음이에요~", "created": "2026-10-12"}, {"id": "r-g30zl9a", "cat": "kinder", "who": "7세 E* 학부모님", "text": "친구들과 놀다가 수업 갈 때는 안 가고 싶다고 할 수도 있는데, 이제까지 한번도 가고 싶지 않다는 말도 한 적 없고 너무 좋아해요.", "created": "2026-10-12"}, {"id": "r-85tmzr6", "cat": "kinder", "who": "7세 J*학부모님", "text": "싫다는 말 한번 없이 재미있게 가고 선생님을 좋아하고 즐겁게 지내 만족하고 감사합니다!", "created": "2026-10-12"}]};</script>
